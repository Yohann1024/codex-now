<svg width="920" height="420" viewBox="0 0 920 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Drag Codex Now to Dock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="920" height="420" rx="28" fill="url(#bg)"/>
  <text x="46" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#0f172a">方式一：拖到 Dock，随时一键启动</text>
  <text x="46" y="102" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#475569">从 Applications 把 Codex Now.app 拖到 Dock。之后先打开目标 Finder 文件夹，再点 Dock 图标。</text>

  <rect x="70" y="145" width="250" height="170" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="94" y="173" width="202" height="24" rx="8" fill="#e2e8f0"/>
  <rect x="94" y="211" width="150" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="94" y="240" width="178" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="94" y="269" width="126" height="16" rx="8" fill="#cbd5e1"/>
  <text x="116" y="345" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#334155">/Applications</text>

  <circle cx="450" cy="230" r="42" fill="#111827" filter="url(#shadow)"/>
  <text x="450" y="244" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="38" font-weight="800" fill="#ffffff">C</text>
  <text x="386" y="303" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Codex Now.app</text>

  <path d="M505 230 C585 230 600 284 662 288" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <path d="M642 265 L674 290 L638 308" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="548" y="203" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#2563eb">拖拽到 Dock</text>

  <rect x="646" y="300" width="210" height="62" rx="25" fill="#ffffff" filter="url(#shadow)" opacity="0.96"/>
  <circle cx="695" cy="331" r="22" fill="#111827"/>
  <text x="695" y="339" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="800" fill="#ffffff">C</text>
  <circle cx="750" cy="331" r="18" fill="#94a3b8"/>
  <circle cx="799" cy="331" r="18" fill="#94a3b8"/>
  <text x="665" y="392" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#334155">Dock</text>
</svg>
